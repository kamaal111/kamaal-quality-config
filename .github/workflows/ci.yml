name: CI

on:
  push:
    branches:
      - '**'

concurrency:
  group: ${{ github.ref }}-ci
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: Quality
        run: pnpm quality

      - name: Build
        run: pnpm clean:build

  test:
    name: Test
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: Test
        run: pnpm test

  consumer:
    name: Consumer (Node 22)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          install: false

      - name: Locate consumer runtime
        id: consumer-node
        run: |
          install -m 755 "$(node -p 'process.execPath')" "$RUNNER_TEMP/consumer-node"
          echo "path=$RUNNER_TEMP/consumer-node" >> "$GITHUB_OUTPUT"

      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: Test packed consumer
        env:
          CONSUMER_NODE: ${{ steps.consumer-node.outputs.path }}
        run: pnpm test src/packed-consumer.test.ts

  swift-consumer:
    name: Swift consumer
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    container: swift:6.4.1-noble
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: Swift versions
        run: |
          swift --version
          swift format --version

      - name: Test Swift consumer
        run: pnpm test:swift-format
