name: Release

on:
  push:
    tags:
      - '*'

permissions:
  id-token: write
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      pnpm_config_registry: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - run: pnpm clean:build

      - run: pnpm release ${{ github.ref_name }}
